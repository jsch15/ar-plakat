<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>AR Fotografie</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: sans-serif; touch-action: none; }

    /* Kleiner Hinweis oben, wenn die Marke erkannt ist */
    #hint {
      display: none; position: fixed; top: 12px; left: 12px; right: 12px; z-index: 10;
      background: rgba(0,0,0,.65); color: #fff; padding: .6rem .9rem;
      border-radius: 10px; font-size: .95rem; text-align: center;
    }

    /* Infofenster (Overlay am unteren Bildrand) */
    #info {
      display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
      background: #fff; color: #111; padding: 1rem 1.25rem 1.4rem;
      border-radius: 14px 14px 0 0; box-shadow: 0 -4px 16px rgba(0,0,0,.3);
      max-height: 45%; overflow-y: auto;
    }
    #info h3 { margin: 0 2rem .4rem 0; }
    #info p  { margin: 0; line-height: 1.4; }
    #info button {
      position: absolute; top: .5rem; right: .75rem;
      border: 0; background: #eee; border-radius: 50%;
      width: 2.2rem; height: 2.2rem; font-size: 1.2rem; cursor: pointer;
    }

    /* Nur im Debug-Modus (?debug): zeigt Koordinaten */
    #debugbox {
      display: none; position: fixed; top: 60px; left: 12px; right: 12px; z-index: 10;
      background: rgba(255,255,0,.9); color: #000; padding: .5rem; font: .85rem monospace;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="colorManagement: true; physicallyCorrectLights: true"
  >
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Licht, damit das Modell nicht schwarz aussieht -->
    <a-entity light="type: ambient; intensity: 1.2"></a-entity>
    <a-entity light="type: directional; intensity: 1.5" position="1 2 3"></a-entity>

    <a-entity id="target0" mindar-image-target="targetIndex: 0">

      <!-- Marker-Fläche: nur sichtbar mit ?debug am Ende der Adresse -->
      <a-plane id="debugPlane" visible="false" color="#00aaff" opacity="0.3"
               position="0 0 0" width="1" height="0.727"></a-plane>

      <!-- pivot = wird vom Finger gedreht und gezoomt -->
      <a-entity id="pivot">
        <!-- startrot = Grunddrehung des Modells (siehe START_ROT unten) -->
        <a-entity id="startrot">
          <!-- holder = automatische Größenanpassung -->
          <a-entity id="holder">
            <a-entity id="model" obj-model="obj: ./models/camera.obj"></a-entity>          </a-entity>
        </a-entity>
        <!-- Hotspots (gelbe Kugeln) werden per Skript hier eingefügt -->
      </a-entity>

    </a-entity>
  </a-scene>

  <div id="hint">Ein Finger: drehen · Zwei Finger: zoomen · Gelben Punkt antippen: Info</div>

  <div id="info">
    <button id="infoClose" aria-label="Schließen">×</button>
    <h3 id="infoTitle"></h3>
    <p id="infoText"></p>
  </div>

  <div id="debugbox"></div>

  <script>
    // =====================================================
    // EINSTELLUNGEN (hier darfst du ändern)
    // =====================================================

    // Größe des Modells, gemessen in Marker-Breiten (1 = so breit wie die Karte)
    const MODEL_SIZE = 0.5;

    // Abstand des Modells vor der Karte (damit es nicht in der Karte steckt)
    const MODEL_Z = 0.25;

    // Grunddrehung des Modells in Grad: "x y z"
    // Wenn die Kamera schief oder falsch herum steht, hier probieren, z. B. "0 180 0" oder "90 0 0"
    const START_ROT = "0 0 0";

    // Seitenverhältnis des Marker-Bildes (Höhe / Breite). marke.jpg: 1396 / 1920 = 0.727
    const MARKER_ASPECT = 0.727;

    // Hotspots: position = "x y z" relativ zur Modellmitte (in Marker-Breiten).
    // Die Werte unten sind nur Startwerte! Echte Werte findest du so:
    // Seite mit ?debug öffnen, auf eine Stelle des Modells tippen,
    // die gelbe Box zeigt die Koordinaten. Hier einsetzen.
    const HOTSPOTS = [
      {
        position: "0 0.05 0.15",
        title: "Objektiv",
        text: "Hier steht später der Text zum Objektiv. Lorem ipsum dolor sit amet, consetetur sadipscing elitr, sed diam nonumy eirmod tempor invidunt ut labore."
      },
      {
        position: "0.12 0.1 0",
        title: "Sucher",
        text: "Hier steht später der Text zum Sucher. Lorem ipsum dolor sit amet, consetetur sadipscing elitr, sed diam nonumy eirmod tempor invidunt."
      }
    ];

    // =====================================================
    // AB HIER: Technik. Für den Anfang nichts ändern.
    // =====================================================

    const THREE = AFRAME.THREE;
    const DEBUG = new URLSearchParams(location.search).has('debug');

    const sceneEl = document.querySelector('a-scene');
    const target  = document.getElementById('target0');
    const pivot   = document.getElementById('pivot');
    const startrot = document.getElementById('startrot');
    const holder  = document.getElementById('holder');
    const model   = document.getElementById('model');
    const hint    = document.getElementById('hint');
    const info    = document.getElementById('info');
    const debugbox = document.getElementById('debugbox');

    // Marker-Höhe und Debug-Anzeige
    document.getElementById('debugPlane').setAttribute('height', MARKER_ASPECT);
    if (DEBUG) {
      document.getElementById('debugPlane').setAttribute('visible', 'true');
      debugbox.style.display = 'block';
      debugbox.textContent = 'Debug an: tippe auf das Modell, um Koordinaten zu sehen.';
    }

    // Grunddrehung und Abstand setzen
    const r = START_ROT.split(' ').map(Number);
    startrot.setAttribute('rotation', { x: r[0], y: r[1], z: r[2] });
    pivot.setAttribute('position', { x: 0, y: 0, z: MODEL_Z });

    // Modell automatisch auf MODEL_SIZE bringen und zentrieren
    model.addEventListener('model-loaded', () => {
      const mesh = model.getObject3D('mesh');
      const tmp = new THREE.Group();
      tmp.add(mesh.clone());
      tmp.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(tmp);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const s = MODEL_SIZE / maxDim;
      holder.object3D.scale.setScalar(s);
      model.object3D.position.copy(center).multiplyScalar(-1);
    });

    // Hotspots erzeugen
    const hotspotEls = [];
    HOTSPOTS.forEach((h) => {
      const p = h.position.split(' ').map(Number);
      const el = document.createElement('a-sphere');
      el.setAttribute('radius', '0.035');
      el.setAttribute('color', '#ffd400');
      el.setAttribute('opacity', '0.9');
      el.setAttribute('position', { x: p[0], y: p[1], z: p[2] });
      el.setAttribute('animation',
        'property: scale; from: 1 1 1; to: 1.35 1.35 1.35; dir: alternate; loop: true; dur: 700; easing: easeInOutSine');
      el.hotspot = h;
      pivot.appendChild(el);
      hotspotEls.push(el);
    });

    // Marke gefunden / verloren
    target.addEventListener('targetFound', () => { hint.style.display = 'block'; });
    target.addEventListener('targetLost', () => {
      hint.style.display = 'none';
      closeInfo();
    });

    // Infofenster (Texte mit textContent, nicht innerHTML)
    function openInfo(h) {
      document.getElementById('infoTitle').textContent = h.title;
      document.getElementById('infoText').textContent = h.text;
      info.style.display = 'block';
    }
    function closeInfo() { info.style.display = 'none'; }
    document.getElementById('infoClose').addEventListener('click', closeInfo);

    // Antippen: Hotspot oder (im Debug) Modell treffen
    const raycaster = new THREE.Raycaster();
    function handleTap(clientX, clientY) {
      const cam = sceneEl.camera;
      const rect = sceneEl.canvas.getBoundingClientRect();
      const ndc = new THREE.Vector2(
        ((clientX - rect.left) / rect.width) * 2 - 1,
        -((clientY - rect.top) / rect.height) * 2 + 1
      );
      raycaster.setFromCamera(ndc, cam);

      const hotspotObjs = hotspotEls.map(e => e.object3D);
      const hits = raycaster.intersectObjects(hotspotObjs, true);
      if (hits.length) {
        let o = hits[0].object;
        while (o && !hotspotEls.some(e => e.object3D === o)) o = o.parent;
        const el = hotspotEls.find(e => e.object3D === o);
        if (el) { openInfo(el.hotspot); return; }
      }

      if (DEBUG) {
        const mhits = raycaster.intersectObject(model.object3D, true);
        if (mhits.length) {
          const local = pivot.object3D.worldToLocal(mhits[0].point.clone());
          // Rückrechnung in die Modell-Ausrichtung nach START_ROT ist nicht nötig:
          // Hotspots hängen am pivot, also gelten diese Koordinaten direkt.
          debugbox.textContent = 'position: "' +
            local.x.toFixed(3) + ' ' + local.y.toFixed(3) + ' ' + local.z.toFixed(3) + '"';
        }
      }
    }

    // Drehen (1 Finger / Maus) und Zoomen (2 Finger / Mausrad)
    const pointers = new Map();
    let startDist = 0, startScale = 1, scale = 1;
    let rotX = 0, rotY = 0;
    let moved = 0, downX = 0, downY = 0;

    function applyTransform() {
      pivot.object3D.rotation.set(rotX, rotY, 0);
      pivot.object3D.scale.setScalar(scale);
    }

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#info')) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 1) { moved = 0; downX = e.clientX; downY = e.clientY; }
      if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        startDist = Math.hypot(a.x - b.x, a.y - b.y);
        startScale = scale;
      }
    });

    window.addEventListener('pointermove', (e) => {
      const p = pointers.get(e.pointerId);
      if (!p) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      p.x = e.clientX; p.y = e.clientY;

      if (pointers.size === 1) {
        moved += Math.abs(dx) + Math.abs(dy);
        rotY += dx * 0.01;
        rotX += dy * 0.01;
        rotX = Math.max(-1.5, Math.min(1.5, rotX));
      } else if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        scale = Math.max(0.4, Math.min(3, startScale * (d / startDist)));
        moved = 999;
      }
      applyTransform();
    });

    function endPointer(e) {
      const wasSingle = pointers.size === 1;
      pointers.delete(e.pointerId);
      // Kurzes Antippen (kaum bewegt) = Tap
      if (wasSingle && moved < 10 && e.type === 'pointerup') {
        handleTap(e.clientX, e.clientY);
      }
    }
    window.addEventListener('pointerup', endPointer);
    window.addEventListener('pointercancel', endPointer);

    // Mausrad (nur zum Testen am Computer)
    window.addEventListener('wheel', (e) => {
      scale = Math.max(0.4, Math.min(3, scale * (e.deltaY < 0 ? 1.1 : 0.9)));
      applyTransform();
    }, { passive: true });
  </script>
</body>
</html>
